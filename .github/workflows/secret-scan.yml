name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout entire history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (all Git history)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git --redact --log-opts="--all" /repo
